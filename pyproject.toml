[project]
name = "bifrost"
version = "0.1.0"
description = "Bridge between Langfuse and other services for retrieving prompts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.0",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.16.3",
    "cz-conventional-gitmoji>=0.7.0",
    "mypy>=2.1.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.18",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "B",   # bugbear (common bugs and design issues)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modernize syntax)
]
ignore = ["E501"]  # line length handled by ruff-format

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.commitizen]
name = "cz_gitmoji"
version = "0.1.0"
tag_format = "v$version"

[tool.poe.tasks.dev]
cmd = "uvicorn app.main:app --reload --host 127.0.0.1 --port 8000"
help = "Start the API with auto-reload"

[tool.poe.tasks.start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
help = "Start the API without reload"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Lint the project with Ruff"

[tool.poe.tasks.lint-fix]
cmd = "ruff check . --fix"
help = "Lint and auto-fix with Ruff"

[tool.poe.tasks.format]
cmd = "ruff format ."
help = "Format the project with Ruff"

[tool.poe.tasks.format-check]
cmd = "ruff format --check ."
help = "Check formatting without writing files"

[tool.poe.tasks.typecheck]
cmd = "mypy app"
help = "Type-check with mypy"

[tool.poe.tasks.check]
sequence = ["lint", "format-check", "typecheck"]
help = "Run lint, format check, and typecheck"

[tool.poe.tasks.migrate]
cmd = "alembic upgrade head"
help = "Apply all database migrations"

[tool.poe.tasks.revision]
cmd = "alembic revision --autogenerate"
help = "Create a new Alembic migration (pass -m \"message\")"

[tool.poe.tasks.commit]
cmd = "cz commit"
help = "Create a conventional commit with gitmoji"

[tool.poe.tasks.pre-commit-install]
cmd = "pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg"
help = "Install git hooks"

[tool.poe.tasks.infra]
cmd = "docker compose up -d redis postgres"
help = "Start Redis and Postgres only"

[tool.poe.tasks.up]
cmd = "docker compose up --build"
help = "Build and run the API with Redis and Postgres"

[tool.poe.tasks.down]
cmd = "docker compose down"
help = "Stop Compose services"
